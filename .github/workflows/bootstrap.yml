name: Install implementation

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct implementation package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part*.b64 | base64 --decode > implementation.zip
          unzip -t implementation.zip
          unzip -o implementation.zip -d .

      - name: Replace bootstrap files with implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap implementation.zip
          rm -f .github/workflows/bootstrap.yml

      - name: Commit installed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Install Kumamoto shelter archive"
          git push
