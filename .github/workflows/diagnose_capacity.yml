name: Diagnose Kumamoto shelter capacity source

on:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose_capacity_source.py
      - scripts/probe_shelter_endpoint.py
      - .github/workflows/diagnose_capacity.yml
  workflow_dispatch:
    inputs:
      municipality_code:
        description: "診断対象市町村コード"
        required: false
        default: "431001"
        type: string

permissions:
  contents: write

concurrency:
  group: kumamoto-capacity-source-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run focused capacity source diagnostics
        id: probe
        shell: bash
        env:
          MUNICIPALITY_CODE: ${{ inputs.municipality_code || '431001' }}
        run: |
          set +e
          rm -rf debug/capacity_probe
          mkdir -p debug/capacity_probe data/logs
          {
            python scripts/diagnose_capacity_source.py \
              --municipality-code "$MUNICIPALITY_CODE" \
              --output-dir debug/capacity_probe
            python scripts/probe_shelter_endpoint.py \
              --output debug/capacity_probe/endpoint_schema.json
          } 2>&1 | tee debug/capacity_probe/workflow.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/capacity_probe/summary.txt data/logs/capacity_probe_summary.txt 2>/dev/null || true
          cp debug/capacity_probe/report.json data/logs/capacity_probe_report.json 2>/dev/null || true
          cp debug/capacity_probe/endpoint_schema.json data/logs/capacity_endpoint_schema.json 2>/dev/null || true
          cp debug/capacity_probe/endpoint_schema.txt data/logs/capacity_endpoint_schema.txt 2>/dev/null || true
          cp debug/capacity_probe/workflow.log data/logs/capacity_probe_workflow.log
          exit 0

      - name: Commit compact diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/logs/capacity_probe_summary.txt \
            data/logs/capacity_probe_report.json \
            data/logs/capacity_endpoint_schema.json \
            data/logs/capacity_endpoint_schema.txt \
            data/logs/capacity_probe_workflow.log
          if git diff --cached --quiet; then
            echo "No diagnostic report changes."
            exit 0
          fi
          git commit -m "Record shelter endpoint schema"
          git pull --rebase origin main
          git push

      - name: Upload complete diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capacity-source-probe-${{ github.run_id }}
          path: debug/capacity_probe/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when diagnostic script failed
        if: steps.probe.outputs.exit_code != '0'
        run: exit 1
