name: Collect municipal shelter evacuee counts

on:
  workflow_run:
    workflows:
      - Collect Kumamoto shelter data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kumamoto-municipal-evacuee-data-write
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate collector
        run: |
          python -m py_compile \
            scripts/collect_municipal_evacuees.py \
            scripts/run_municipal_evacuee_collection.py \
            scripts/yatsushiro_evacuee_pdf.py \
            scripts/uki_evacuee_html.py

      - name: Collect evacuee counts
        id: collect
        shell: bash
        run: |
          set +e
          rm -rf debug/municipal_evacuees
          mkdir -p debug/municipal_evacuees data/logs
          python scripts/run_municipal_evacuee_collection.py \
            --status-csv data/status_by_date.csv \
            --aliases-csv reference/municipal_evacuee_shelter_aliases.csv \
            --observations-csv data/municipal_evacuees/all_observations.csv \
            --wide-csv data/evacuee_count_by_date.csv \
            --issues-csv data/municipal_evacuees/matching_issues.csv \
            --latest-csv data/municipal_evacuees/latest_observations.csv \
            --log-json data/logs/municipal_evacuee_collection.json \
            --debug-dir debug/municipal_evacuees \
            2>&1 | tee debug/municipal_evacuees/workflow.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/municipal_evacuees/workflow.log data/logs/municipal_evacuee_last_run.log
          if [ "$STATUS" -ne 0 ]; then
            cp debug/municipal_evacuees/workflow.log data/logs/municipal_evacuee_last_failure.log
          else
            rm -f data/logs/municipal_evacuee_last_failure.log
          fi
          exit 0

      - name: Commit observations or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.collect.outputs.exit_code }}" = "0" ]; then
            git add \
              data/evacuee_count_by_date.csv \
              data/municipal_evacuees \
              data/logs/municipal_evacuee_collection.json
            if git diff --cached --quiet; then
              echo "Municipal evacuee sources are unchanged; no commit is required."
              exit 0
            fi
            git add data/logs/municipal_evacuee_last_run.log
            git add data/logs/municipal_evacuee_last_failure.log 2>/dev/null || true
            git commit -m "Update municipal shelter evacuee counts"
          else
            git add data/logs/municipal_evacuee_last_run.log
            git add data/logs/municipal_evacuee_last_failure.log
            git add data/municipal_evacuees/matching_issues.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Failure diagnostics are unchanged."
              exit 0
            fi
            git commit -m "Record municipal evacuee collection failure"
          fi

          git pull --rebase origin main
          git push

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: municipal-evacuee-diagnostics-${{ github.run_id }}
          path: debug/municipal_evacuees/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail workflow when collection failed
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "Municipal evacuee collection failed with exit code ${{ steps.collect.outputs.exit_code }}."
          exit 1
