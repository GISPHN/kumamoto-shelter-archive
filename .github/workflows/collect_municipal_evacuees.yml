name: Collect municipal shelter evacuee counts

on:
  push:
    branches:
      - main
    paths:
      - scripts/collect_municipal_evacuees.py
      - reference/municipal_evacuee_shelter_aliases.csv
      - requirements.txt
      - .github/workflows/collect_municipal_evacuees.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate collector
        run: python -m py_compile scripts/collect_municipal_evacuees.py

      - name: Collect evacuee counts
        run: |
          rm -rf debug/municipal_evacuees
          python scripts/collect_municipal_evacuees.py \
            --status-csv data/status_by_date.csv \
            --aliases-csv reference/municipal_evacuee_shelter_aliases.csv \
            --observations-csv data/municipal_evacuees/all_observations.csv \
            --wide-csv data/evacuee_count_by_date.csv \
            --issues-csv data/municipal_evacuees/matching_issues.csv \
            --latest-csv data/municipal_evacuees/latest_observations.csv \
            --log-json data/logs/municipal_evacuee_collection.json \
            --debug-dir debug/municipal_evacuees

      - name: Commit updated observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/evacuee_count_by_date.csv \
            data/municipal_evacuees \
            data/logs/municipal_evacuee_collection.json
          if git diff --cached --quiet; then
            echo "Municipal evacuee sources are unchanged."
            exit 0
          fi
          git commit -m "Update municipal shelter evacuee counts"
          git pull --rebase origin main
          git push

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: municipal-evacuee-diagnostics-${{ github.run_id }}
          path: debug/municipal_evacuees/
          if-no-files-found: ignore
          retention-days: 30
