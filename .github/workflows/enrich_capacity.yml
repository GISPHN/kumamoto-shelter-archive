name: Enrich shelter data with capacity

on:
  workflow_run:
    workflows:
      - Collect Kumamoto shelter data
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - reference/portal_shelter_capacity.csv
      - reference/portal_shelter_capacity_metadata.json
      - scripts/capacity_matcher.py
      - scripts/enrich_capacity_outputs.py
      - scripts/build_time_series.py
      - scripts/validate_capacity_outputs.py
      - .github/workflows/enrich_capacity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-data-write
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate capacity scripts
        run: |
          python -m py_compile \
            scripts/capacity_matcher.py \
            scripts/enrich_capacity_outputs.py \
            scripts/build_time_series.py \
            scripts/validate_capacity_outputs.py

      - name: Enrich all archived CSVs from the persistent capacity master
        run: |
          python scripts/enrich_capacity_outputs.py \
            --data-root data \
            --capacity-csv reference/portal_shelter_capacity.csv

      - name: Rebuild wide time-series CSVs
        run: python scripts/build_time_series.py --data-root data

      - name: Validate enriched outputs
        run: |
          python scripts/validate_capacity_outputs.py \
            --master reference/portal_shelter_capacity.csv \
            --metadata reference/portal_shelter_capacity_metadata.json \
            --latest data/latest.csv \
            --status-by-date data/status_by_date.csv \
            --output data/logs/capacity_validation.json \
            --minimum-master-records 2000

      - name: Commit enriched outputs and validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Capacity-enriched CSVs and validation are already up to date."
            exit 0
          fi
          git commit -m "Validate capacity-enriched shelter archive"
          git pull --rebase origin main
          git push
