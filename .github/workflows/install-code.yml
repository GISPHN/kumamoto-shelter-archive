name: Install verified shelter collector source

on:
  push:
    branches:
      - main
    paths:
      - payload/**
      - .github/workflows/install-code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-shelter-collector-source
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/codepart01.b64 \
            payload/codepart02a.b64 \
            payload/codepart02b.b64 \
            payload/codepart03a.b64 \
            payload/codepart03b.b64 \
            | base64 --decode > /tmp/implementation-code.zip

          echo "63ea426614f49f936cea02af984e95fd4d9fcec95f756707149110fec8cb8e16  /tmp/implementation-code.zip" \
            | sha256sum --check --strict
          unzip -t /tmp/implementation-code.zip
          unzip -o /tmp/implementation-code.zip -d .
          python -m py_compile scripts/collect_shelters.py scripts/reference_matcher.py

      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts .gitignore data debug
          if git diff --cached --quiet; then
            echo "Source files are already installed."
            exit 0
          fi
          git commit -m "Install verified shelter collector source"
          git push
