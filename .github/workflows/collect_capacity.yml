name: Collect Kumamoto shelter capacity

on:
  push:
    branches:
      - main
    paths:
      - scripts/collect_capacity.py
      - scripts/capacity_matcher.py
      - scripts/coordinate_enricher.py
      - scripts/enrich_capacity_outputs.py
      - scripts/build_time_series.py
      - scripts/validate_capacity_outputs.py
      - scripts/validate_coordinate_outputs.py
      - reference/manual_geocoding/**
      - reference/manual_geocoding_metadata.json
      - .github/workflows/collect_capacity.yml
  workflow_dispatch:
    inputs:
      minimum_records:
        description: "取得成功と判定する全避難所件数の下限"
        required: false
        default: "2000"
        type: string
      minimum_parsed:
        description: "正の定員を取得できた施設数の下限"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-data-write
  cancel-in-progress: false

jobs:
  collect-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile \
            scripts/collect_capacity.py \
            scripts/capacity_matcher.py \
            scripts/coordinate_enricher.py \
            scripts/enrich_capacity_outputs.py \
            scripts/build_time_series.py \
            scripts/validate_capacity_outputs.py \
            scripts/validate_coordinate_outputs.py

      - name: Collect statewide capacity master from official JSON
        id: capacity
        shell: bash
        env:
          MINIMUM_RECORDS: ${{ inputs.minimum_records || '2000' }}
          MINIMUM_PARSED: ${{ inputs.minimum_parsed || '1' }}
        run: |
          set +e
          mkdir -p debug/capacity data/logs reference/capacity_history
          {
            set -euo pipefail
            python scripts/collect_capacity.py \
              --output reference/portal_shelter_capacity.csv \
              --metadata-output reference/portal_shelter_capacity_metadata.json \
              --history-dir reference/capacity_history \
              --minimum-records "$MINIMUM_RECORDS" \
              --minimum-parsed "$MINIMUM_PARSED"
          } 2>&1 | tee debug/capacity/workflow.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/capacity/workflow.log data/logs/capacity_latest_run.log
          if [ "$STATUS" -ne 0 ]; then
            cp debug/capacity/workflow.log data/logs/capacity_last_failure.log
          else
            rm -f data/logs/capacity_last_failure.log
          fi
          exit 0

      - name: Apply persistent attributes to all archived data
        if: steps.capacity.outputs.exit_code == '0'
        run: |
          python scripts/enrich_capacity_outputs.py \
            --data-root data \
            --capacity-csv reference/portal_shelter_capacity.csv \
            --manual-geocoding reference/manual_geocoding
          python scripts/build_time_series.py --data-root data

      - name: Validate generated master and enriched outputs
        if: steps.capacity.outputs.exit_code == '0'
        run: |
          python scripts/validate_capacity_outputs.py \
            --master reference/portal_shelter_capacity.csv \
            --metadata reference/portal_shelter_capacity_metadata.json \
            --latest data/latest.csv \
            --status-by-date data/status_by_date.csv \
            --output data/logs/capacity_validation.json \
            --minimum-master-records 2000
          python scripts/validate_coordinate_outputs.py \
            --data-root data \
            --manual-geocoding reference/manual_geocoding \
            --output data/logs/coordinate_validation.json \
            --expected-manual-records 138

      - name: Commit capacity master or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logs/capacity_latest_run.log
          git add data/logs/capacity_last_failure.log 2>/dev/null || true
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git add \
              reference/portal_shelter_capacity.csv \
              reference/portal_shelter_capacity_metadata.json \
              reference/capacity_history \
              data
          fi
          if git diff --cached --quiet; then
            echo "No capacity, coordinate, or diagnostic changes to commit."
            exit 0
          fi
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git commit -m "Refresh verified shelter capacity and coordinates"
          else
            git commit -m "Record failed shelter capacity diagnostics"
          fi
          git pull --rebase origin main
          git push

      - name: Upload capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shelter-capacity-diagnostics-${{ github.run_id }}
          path: |
            debug/capacity/
            data/logs/capacity_latest_run.log
            data/logs/capacity_last_failure.log
            data/logs/capacity_validation.json
            data/logs/coordinate_validation.json
            reference/portal_shelter_capacity_metadata.json
            reference/manual_geocoding_metadata.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail workflow when capacity collection failed
        if: steps.capacity.outputs.exit_code != '0'
        run: |
          echo "Capacity collection failed with exit code ${{ steps.capacity.outputs.exit_code }}."
          exit 1
