name: Collect Kumamoto shelter capacity

on:
  push:
    branches:
      - main
    paths:
      - scripts/collect_capacity.py
      - scripts/capacity_matcher.py
      - scripts/enrich_capacity_outputs.py
      - scripts/build_time_series.py
      - .github/workflows/collect_capacity.yml
  workflow_dispatch:
    inputs:
      minimum_records:
        description: "取得成功と判定する全避難所件数の下限"
        required: false
        default: "2000"
        type: string
      minimum_parsed:
        description: "正の定員を取得できた施設数の下限"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-collection
  cancel-in-progress: true

jobs:
  collect-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile \
            scripts/collect_capacity.py \
            scripts/capacity_matcher.py \
            scripts/enrich_capacity_outputs.py \
            scripts/build_time_series.py

      - name: Collect statewide capacity master from official JSON
        id: capacity
        shell: bash
        env:
          MINIMUM_RECORDS: ${{ inputs.minimum_records || '2000' }}
          MINIMUM_PARSED: ${{ inputs.minimum_parsed || '1' }}
        run: |
          set +e
          mkdir -p debug/capacity data/logs reference/capacity_history
          {
            set -euo pipefail
            python scripts/collect_capacity.py \
              --output reference/portal_shelter_capacity.csv \
              --metadata-output reference/portal_shelter_capacity_metadata.json \
              --history-dir reference/capacity_history \
              --minimum-records "$MINIMUM_RECORDS" \
              --minimum-parsed "$MINIMUM_PARSED"
          } 2>&1 | tee debug/capacity/workflow.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/capacity/workflow.log data/logs/capacity_latest_run.log
          if [ "$STATUS" -ne 0 ]; then
            cp debug/capacity/workflow.log data/logs/capacity_last_failure.log
          else
            rm -f data/logs/capacity_last_failure.log
          fi
          exit 0

      - name: Apply persistent capacity to all archived data
        if: steps.capacity.outputs.exit_code == '0'
        run: |
          python scripts/enrich_capacity_outputs.py \
            --data-root data \
            --capacity-csv reference/portal_shelter_capacity.csv
          python scripts/build_time_series.py --data-root data

      - name: Validate generated master and outputs
        if: steps.capacity.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          master = Path("reference/portal_shelter_capacity.csv")
          metadata_path = Path("reference/portal_shelter_capacity_metadata.json")
          status_path = Path("data/status_by_date.csv")

          with master.open("r", encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          with status_path.open("r", encoding="utf-8-sig", newline="") as handle:
              status_reader = csv.DictReader(handle)
              status_columns = set(status_reader.fieldnames or [])
              status_rows = list(status_reader)

          required_master = {
              "portal_shelter_id", "municipality_code", "municipality",
              "shelter_name", "address", "portal_capacity_persons",
              "portal_capacity_raw", "capacity_parse_status",
              "portal_latitude", "portal_longitude", "source_url",
          }
          missing_master = required_master - set(rows[0] if rows else {})
          if missing_master:
              raise SystemExit(f"Capacity master missing columns: {sorted(missing_master)}")
          if len(rows) < 2000:
              raise SystemExit(f"Capacity master has too few rows: {len(rows)}")
          ids = [row["portal_shelter_id"] for row in rows]
          if not all(ids) or len(ids) != len(set(ids)):
              raise SystemExit("portal_shelter_id is empty or duplicated")
          parsed = sum(bool(row["portal_capacity_persons"]) for row in rows)
          if parsed != int(metadata["parsed_capacity_count"]):
              raise SystemExit(
                  f"Parsed capacity mismatch: csv={parsed}, metadata={metadata['parsed_capacity_count']}"
              )
          required_status = {
              "portal_shelter_id", "portal_capacity_persons",
              "capacity_match_status", "capacity_match_method",
          }
          if required_status - status_columns:
              raise SystemExit(
                  f"status_by_date missing capacity columns: {sorted(required_status - status_columns)}"
              )
          matched_status = sum(row.get("capacity_match_status") == "matched" for row in status_rows)
          print(
              f"Validated capacity master: rows={len(rows)}, parsed={parsed}, "
              f"municipalities={metadata['municipality_count']}, "
              f"status_by_date_matched={matched_status}/{len(status_rows)}"
          )
          PY

      - name: Commit capacity master or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logs/capacity_latest_run.log
          git add data/logs/capacity_last_failure.log 2>/dev/null || true
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git add \
              reference/portal_shelter_capacity.csv \
              reference/portal_shelter_capacity_metadata.json \
              reference/capacity_history \
              data
          fi
          if git diff --cached --quiet; then
            echo "No capacity or diagnostic changes to commit."
            exit 0
          fi
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git commit -m "Add verified persistent shelter capacity master"
          else
            git commit -m "Record failed shelter capacity diagnostics"
          fi
          git pull --rebase origin main
          git push

      - name: Upload capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shelter-capacity-diagnostics-${{ github.run_id }}
          path: |
            debug/capacity/
            data/logs/capacity_latest_run.log
            data/logs/capacity_last_failure.log
            reference/portal_shelter_capacity_metadata.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail workflow when capacity collection failed
        if: steps.capacity.outputs.exit_code != '0'
        run: |
          echo "Capacity collection failed with exit code ${{ steps.capacity.outputs.exit_code }}."
          exit 1
