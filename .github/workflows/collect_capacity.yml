name: Collect Kumamoto shelter capacity

on:
  push:
    branches:
      - main
    paths:
      - scripts/collect_capacity.py
      - .github/workflows/collect_capacity.yml
  workflow_dispatch:
    inputs:
      municipality_code:
        description: "対象市町村コード。空欄なら熊本県内全市町村"
        required: false
        type: string
      max_municipalities:
        description: "試験実行時の最大市町村数。0なら制限なし"
        required: false
        default: "0"
        type: string
      minimum_parsed:
        description: "取得成功と判定する定員件数の下限"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-collection
  cancel-in-progress: true

jobs:
  collect-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate scripts
        run: |
          python -m py_compile \
            scripts/collect_capacity.py \
            scripts/capacity_matcher.py \
            scripts/enrich_capacity_outputs.py \
            scripts/build_time_series.py

      - name: Collect capacity master once
        id: capacity
        shell: bash
        env:
          MUNICIPALITY_CODE: ${{ inputs.municipality_code }}
          MAX_MUNICIPALITIES: ${{ inputs.max_municipalities || '0' }}
          MINIMUM_PARSED: ${{ inputs.minimum_parsed || '1' }}
        run: |
          set +e
          mkdir -p debug/capacity data/logs reference/capacity_history
          {
            set -euo pipefail
            args=(
              --output reference/portal_shelter_capacity.csv
              --history-dir reference/capacity_history
              --debug-dir debug/capacity
              --max-municipalities "$MAX_MUNICIPALITIES"
              --minimum-parsed "$MINIMUM_PARSED"
            )
            if [ -n "${MUNICIPALITY_CODE:-}" ]; then
              args+=(--municipality-code "$MUNICIPALITY_CODE")
            fi
            python scripts/collect_capacity.py "${args[@]}"
          } 2>&1 | tee debug/capacity/workflow.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/capacity/workflow.log data/logs/capacity_latest_run.log
          if [ "$STATUS" -ne 0 ]; then
            cp debug/capacity/workflow.log data/logs/capacity_last_failure.log
          else
            rm -f data/logs/capacity_last_failure.log
          fi
          exit 0

      - name: Apply persistent capacity to all archived data
        if: steps.capacity.outputs.exit_code == '0'
        run: |
          python scripts/enrich_capacity_outputs.py \
            --data-root data \
            --capacity-csv reference/portal_shelter_capacity.csv
          python scripts/build_time_series.py --data-root data

      - name: Commit capacity master or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logs/capacity_latest_run.log
          git add data/logs/capacity_last_failure.log 2>/dev/null || true
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git add reference/portal_shelter_capacity.csv reference/capacity_history data
          fi
          if git diff --cached --quiet; then
            echo "No capacity or diagnostic changes to commit."
            exit 0
          fi
          if [ "${{ steps.capacity.outputs.exit_code }}" = "0" ]; then
            git commit -m "Add persistent shelter capacity master"
          else
            git commit -m "Record failed shelter capacity diagnostics"
          fi
          git pull --rebase origin main
          git push

      - name: Upload capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shelter-capacity-diagnostics-${{ github.run_id }}
          path: debug/capacity/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail workflow when capacity collection failed
        if: steps.capacity.outputs.exit_code != '0'
        run: |
          echo "Capacity collection failed with exit code ${{ steps.capacity.outputs.exit_code }}."
          exit 1
