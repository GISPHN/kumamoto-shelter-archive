name: Clean temporary transfer files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-transfer-files.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap payload
          if git diff --cached --quiet; then
            echo "No temporary files remain."
            exit 0
          fi
          git commit -m "Remove temporary implementation transfer files"
          git push
