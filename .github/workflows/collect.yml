name: Collect Kumamoto shelter data

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - requirements.txt
      - reference/**
      - .github/workflows/collect.yml
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "記録日（YYYY-MM-DD、空欄なら実行日の日本時間）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kumamoto-shelter-capacity-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine snapshot date
        id: observation
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.snapshot_date }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_DATE:-}" ]; then
            SNAPSHOT_DATE="$MANUAL_DATE"
          else
            SNAPSHOT_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          date -d "$SNAPSHOT_DATE" +%F >/dev/null
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          echo "Snapshot date: $SNAPSHOT_DATE"

      - name: Install, validate, collect, and enrich
        id: collector
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ steps.observation.outputs.snapshot_date }}
          REFERENCE_URL: "https://hinanmap.gsi.go.jp/hinanjocp/defaultFtpData/csv/43000_1.csv"
          MINIMUM_ROWS: "100"
          MINIMUM_MATCH_RATE: "0.0"
          SHELTER_REFERENCE_CSV: "reference/43000_1.csv"
        run: |
          set +e
          mkdir -p debug data/logs reference

          {
            set -euo pipefail
            echo "=== Environment ==="
            date --iso-8601=seconds
            python --version

            echo "=== Install Python dependencies ==="
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m playwright install --with-deps chromium

            echo "=== Prepare reference CSV ==="
            if [ -s reference/43000_1.csv ]; then
              echo "Using reference/43000_1.csv stored in the repository."
            else
              echo "Reference CSV is not stored in the repository; downloading the official file."
              curl --fail --location --retry 4 --retry-all-errors \
                --connect-timeout 30 --max-time 180 \
                --user-agent "GISPHN-kumamoto-shelter-archive/1.0" \
                "$REFERENCE_URL" -o reference/43000_1.csv
            fi

            python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("reference/43000_1.csv")
          required = {
              "NO", "共通ID", "施設・場所名", "住所",
              "指定緊急避難場所との住所同一",
              "その他市町村長が必要と認める事項",
              "受入対象者", "緯度", "経度", "備考",
          }
          with path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fields = set(reader.fieldnames or [])
              rows = sum(1 for _ in reader)
          missing = sorted(required - fields)
          if missing:
              raise SystemExit(f"Reference CSV missing columns: {missing}")
          if rows < 1000:
              raise SystemExit(f"Reference CSV has too few rows: {rows}")
          print(f"Validated reference CSV: {rows} rows")
          PY

            echo "=== Apply portal compatibility patches ==="
            python scripts/apply_dgrid_patch.py
            python scripts/refine_dgrid_patch.py
            python scripts/ensure_dgrid_meta.py

            echo "=== Run smoke checks ==="
            python -m py_compile \
              scripts/collect_shelters.py \
              scripts/reference_matcher.py \
              scripts/capacity_matcher.py \
              scripts/coordinate_enricher.py \
              scripts/enrich_capacity_outputs.py \
              scripts/validate_capacity_outputs.py \
              scripts/validate_coordinate_outputs.py \
              scripts/diagnose_html.py \
              scripts/apply_dgrid_patch.py \
              scripts/refine_dgrid_patch.py \
              scripts/ensure_dgrid_meta.py \
              scripts/build_time_series.py
            python - <<'PY'
          from pathlib import Path
          from scripts.coordinate_enricher import CoordinateEnricher
          from scripts.reference_matcher import ReferenceMatcher

          matcher = ReferenceMatcher(Path("reference/43000_1.csv"))
          if len(matcher.rows) < 1000:
              raise SystemExit(f"Reference matcher loaded too few rows: {len(matcher.rows)}")
          manual = CoordinateEnricher(Path("reference/manual_geocoding"))
          if len(manual.rows) != 138:
              raise SystemExit(f"Manual geocoding row count is invalid: {len(manual.rows)}")
          print(f"Reference matcher loaded: {len(matcher.rows)} rows")
          print(f"Manual geocoding loaded: {len(manual.rows)} rows")
          PY

            echo "=== Collect rendered shelter table ==="
            python scripts/collect_shelters.py --snapshot-date "$SNAPSHOT_DATE"

            echo "=== Enrich capacity and complete coordinates ==="
            python scripts/enrich_capacity_outputs.py \
              --data-root data \
              --capacity-csv reference/portal_shelter_capacity.csv \
              --manual-geocoding reference/manual_geocoding \
              --snapshot-date "$SNAPSHOT_DATE"

            echo "=== Build wide daily time-series CSVs ==="
            python scripts/build_time_series.py --data-root data

            echo "=== Export current opened shelters for review ==="
            python - <<'PY'
          import csv
          from pathlib import Path

          source = Path("data/latest.csv")
          output = Path("data/latest_open.csv")
          with source.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = list(reader.fieldnames or [])
              rows = [row for row in reader if row.get("is_open") == "true"]
          with output.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
          print(f"Exported current opened shelters: {len(rows)} rows")
          PY

            echo "=== Validate capacity and coordinate coverage ==="
            python scripts/validate_capacity_outputs.py \
              --master reference/portal_shelter_capacity.csv \
              --metadata reference/portal_shelter_capacity_metadata.json \
              --latest data/latest.csv \
              --status-by-date data/status_by_date.csv \
              --output data/logs/capacity_validation.json \
              --minimum-master-records 2000
            python scripts/validate_coordinate_outputs.py \
              --data-root data \
              --manual-geocoding reference/manual_geocoding \
              --output data/logs/coordinate_validation.json \
              --expected-manual-records 138
          } 2>&1 | tee debug/workflow.log

          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cp debug/workflow.log data/logs/latest_run.log

          if [ "$STATUS" -ne 0 ]; then
            if [ -s debug/latest_page.html ]; then
              python scripts/diagnose_html.py debug/latest_page.html >> debug/workflow.log 2>&1 || true
              cp debug/workflow.log data/logs/latest_run.log
            fi
            cp debug/workflow.log data/logs/last_failure.log
            cp debug/latest_page.html data/logs/last_failure_page.html 2>/dev/null || true
            cp debug/latest_page.png data/logs/last_failure_page.png 2>/dev/null || true
            {
              echo "## Shelter collection failed"
              echo
              echo '```text'
              tail -n 120 debug/workflow.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f \
              data/logs/last_failure.log \
              data/logs/last_failure_page.html \
              data/logs/last_failure_page.png
            echo "## Shelter collection and coordinate validation succeeded" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

      - name: Commit snapshot or failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data or diagnostic changes to commit."
            exit 0
          fi
          if [ "${{ steps.collector.outputs.exit_code }}" = "0" ]; then
            git commit -m "Record coordinate-complete shelter snapshot ${{ steps.observation.outputs.snapshot_date }}"
          else
            git commit -m "Record failed shelter collection diagnostics"
          fi
          git pull --rebase origin main
          git push

      - name: Upload diagnostics on failure
        if: steps.collector.outputs.exit_code != '0'
        uses: actions/upload-artifact@v6
        with:
          name: shelter-collector-debug-${{ github.run_id }}
          path: |
            debug/
            data/logs/
            data/matching_issues/
            data/latest_matching_issues.csv
            data/latest_capacity_matching_issues.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail workflow when collection failed
        if: steps.collector.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Collection failed with exit code ${{ steps.collector.outputs.exit_code }}."
          exit 1
